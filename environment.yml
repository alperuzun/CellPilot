name: CellPilot-dev-311
channels:
  - pytorch
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # PyTorch (conda for proper platform-specific binaries)
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  # Bioconda packages
  - celltypist=1.7.1
  # Scientific computing
  - numpy=1.26.4
  - scikit-learn=1.6.1
  - scikit-image
  - seaborn=0.13.2
  - pillow
  - pyyaml
  - networkx
  - openpyxl
  # Build dependencies (headers needed by pip packages)
  - xz
  - bzip2
  - llvm-openmp  # Required by xgboost (PopV dependency) on macOS
  # Conda-only packages (better binary builds)
  - python-annoy
  - s_gd2
  - pip:
      # Core single-cell analysis
      - scanpy==1.10.3
      - anndata>=0.11
      - omicverse==1.6.10
      - cellphonedb==5.0.1
      - infercnvpy==0.4.5
      - leidenalg==0.10.2
      - igraph==0.11.8
      - louvain==0.8.2
      - umap-learn==0.5.7
      - numba==0.60.0
      - harmonypy==0.0.10
      - pydeseq2==0.4.12
      - gtfparse==2.5.0
      - geosketch==1.3
      - pymde==0.1.18
      - biopython
      - beautifulsoup4
      # API server
      - fastapi==0.115.12
      - uvicorn[standard]==0.34.2
      - python-dotenv==1.1.0
      - pydantic>=2.11
      # ML / Deep learning
      - tensorflow==2.19.0
      - torch-geometric==2.6.1
      - transformers==4.50.3
      # Data & visualization
      - pandas==2.2.3
      - scipy==1.14.1
      - matplotlib==3.6.3
      - plotly==6.0.1
      - plotnine==0.12.4
      - pycomplexheatmap==1.8.2
      - ktplotspy==0.2.4
      - chord==6.0.1
      - openchord==0.1.7
      - drawsvg==2.4.0
      - statsmodels==0.14.4
      - lifelines==0.30.0
      - h5py>=3.13
      - tqdm
      - openai==2.11.0
      - anthropic>=0.97
      - mllmcelltype
      # Ensemble annotation (PopV)
      - scvi-tools>=1.2,<1.3
      - popv>=0.6
